name: Ekstrak ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ekstrak ZIP
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          zip_path = root / "project.zip"

          if not zip_path.is_file():
              raise FileNotFoundError("project.zip tidak ditemukan di folder utama repository")

          with zipfile.ZipFile(zip_path) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()

                  if not target.is_relative_to(root):
                      raise ValueError("Path ZIP tidak aman: " + item.filename)

                  relative = target.relative_to(root)
                  first_folder = next(iter(relative.parts), "")

                  if first_folder in (".git", ".github"):
                      raise ValueError("ZIP tidak boleh berisi .git atau .github")

              archive.extractall(root)

          zip_path.unlink()

      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Ekstrak project.zip"
            git push
          fi
