name: UNZIP AMAN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-24.04

    steps:
      - name: Ambil repository
        uses: actions/checkout@v5

      - name: Ekstrak dan bersihkan file sensitif
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          zip_file = root / "project.zip"

          if not zip_file.is_file():
              raise FileNotFoundError(
                  "project.zip tidak ditemukan di folder utama repository."
              )

          with zipfile.ZipFile(zip_file, "r") as archive:
              for entry in archive.infolist():
                  destination = (root / entry.filename).resolve()

                  if not destination.is_relative_to(root):
                      raise ValueError("Path ZIP tidak aman.")

                  relative = destination.relative_to(root)
                  first_part = next(iter(relative.parts), "")

                  if first_part in (".git", ".github"):
                      raise ValueError(
                          "ZIP tidak boleh berisi .git atau .github."
                      )

                  if destination == zip_file:
                      raise ValueError(
                          "ZIP tidak boleh berisi project.zip di folder utama."
                      )

              archive.extractall(root)

          zip_file.unlink()

          for path in root.rglob("*"):
              relative = path.relative_to(root)

              if ".git" in relative.parts or ".github" in relative.parts:
                  continue

              if not path.is_file():
                  continue

              name = path.name.lower()

              is_env = (
                  name.startswith(".env")
                  and name != ".env.example"
              )
              is_backup = ".bak" in name or ".backup" in name
              is_config = name.startswith("config.json")
              is_zip = path.suffix.lower() == ".zip"

              if is_env or is_backup or is_config or is_zip:
                  print("Menghapus:", relative)
                  path.unlink()

          ignore_file = root / ".gitignore"
          rules = """
          
          # File rahasia dan cadangan
          .env*
          !.env.example
          *.bak*
          *.backup*
          config.json*
          *.zip
          node_modules/
          """

          with ignore_file.open("a", encoding="utf-8") as file:
              file.write(rules)

          print("Ekstraksi dan pembersihan selesai.")

      - name: Simpan hasil ke repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Ekstrak ZIP tanpa file konfigurasi dan backup"
            git push
          fi
